# Build the project site (site/ plus the app's own Tail, games, themes and the
# README images) with scripts/build-site.mjs and publish it on GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'public/app/**'
      - 'public/vendor/fonts/**'
      - 'public/favicon.svg'
      - 'docs/**'
      - 'scripts/build-site.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-site.mjs --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
